# Compila o Eito e publica no Firebase Hosting a cada envio para o GitHub.
# Não precisa ter o Flutter instalado no computador: tudo roda aqui.
name: Publicar o Eito

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Completar o projeto (só cria o que falta, não apaga nada)
        run: |
          flutter --version
          flutter create . --platforms=web --project-name eito_gestao_rural
          rm -f test/widget_test.dart

      - name: Baixar pacotes
        run: flutter pub get

      - name: Revisar o código (erros param e aparecem nas anotações)
        shell: bash
        run: |
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analise.txt" 2>&1; then
            cat "$RUNNER_TEMP/analise.txt"
            grep -E '^ *error' "$RUNNER_TEMP/analise.txt" | head -40 | tr '\n' '|' | sed 's/^/::error title=Erro no código::/'
            echo
            exit 1
          fi

      - name: Testes
        run: flutter test

      - name: Nova versão do app para os aparelhos
        run: sed -i "s/const CACHE = 'eito-v[0-9]*';/const CACHE = 'eito-v${{ github.run_number }}';/" web/sw.js

      - name: Compilar
        run: flutter build web --release --no-web-resources-cdn

      - name: Lista de arquivos para o app abrir sem sinal
        run: |
          cd build/web
          lista=$(find . -type f ! -name 'sw.js' ! -name '*.map' ! -name '*.html' ! -name '*.symbols' ! -name '.last_build_id' ! -name 'flutter_service_worker.js' \
            ! -name 'robots.txt' ! -name 'sitemap.xml' ! -name 'version.json' ! -path '*/skwasm*' ! -path './canvaskit/webparagraph/*' ! -path './canvaskit/wimp*' \
            | sed 's|^\./||' | sort | sed "s/.*/'&'/" | paste -sd, -)
          sed -i "s|/\* ARQUIVOS_DO_BUILD \*/|$lista|" sw.js
          grep -q "canvaskit.wasm" sw.js || { echo "::error::sw.js sem a lista do CanvasKit"; exit 1; }

      - name: Guardar o site compilado
        uses: actions/upload-artifact@v4
        with:
          name: eito-web
          path: build/web

      - name: Publicar no Firebase (site + regras do Firestore)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::Falta o segredo FIREBASE_SERVICE_ACCOUNT (veja PUBLICAR.md). O app foi compilado, mas não publicado."
            exit 0
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project caderneta-rebanho --non-interactive
          echo "### Publicado em https://caderneta-rebanho.web.app" >> "$GITHUB_STEP_SUMMARY"
