  <style>
    html, body { margin: 0; height: 100%; background: #262E12; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #F4F1E6; }
    #carregando img { width: 112px; height: 112px; }
    #carregando p { margin: 0; font-size: 18px; opacity: .85; }
    #carregando .sobre { position: absolute; bottom: 16px; left: 16px; right: 16px;
      text-align: center; font-size: 13px; opacity: .6; }

<body>
  <div id="carregando">
    <img src="icons/Icon-192.png" alt="Eito Gestão Rural">
    <p>Abrindo o Eito…</p>
    <div class="sobre">
      <h1>Eito Gestão Rural</h1>
      Aplicativo de gestão de rebanho bovino que funciona sem internet: pesagem,
      inseminação, sanidade, pastos e piquetes, estoque, dieta, compras e vendas,
      financeiro e relatórios da fazenda. <a href="folder.html">Conheça o aplicativo</a>.
    </div>
  </div>

  <script>
    // Guarda o app no aparelho para abrir mesmo sem sinal (fora do modo de desenvolvimento).
    if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
    // Botão "Instalar app": guarda o convite do navegador (Android/Chrome) para o app usar.
    window.eitoInstalar = {
      evento: null,
      instalado: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
      ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
      pode: function () {
        return !this.instalado && (this.evento !== null || this.ios);
      },
      instalar: async function () {
        if (!this.evento) return 'manual';
        this.evento.prompt();
        var r = await this.evento.userChoice;
        this.evento = null;
        window.dispatchEvent(new Event('eito-instalar'));
        return r.outcome;
      },
    };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.eitoInstalar.evento = e;
      window.dispatchEvent(new Event('eito-instalar'));
    });
    window.addEventListener('appinstalled', function () {
      window.eitoInstalar.instalado = true;
      window.eitoInstalar.evento = null;
      window.dispatchEvent(new Event('eito-instalar'));
    });
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="leitor_nota.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
